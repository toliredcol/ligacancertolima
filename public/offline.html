<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #1f2937;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #C41E3A;
        background: #fdecef;
        border: 1px solid #f8cfd6;
        border-radius: 999px;
        padding: 8px 14px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 10px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #4b5563;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        color: #ffffff;
        background: #C41E3A;
        border-radius: 12px;
        padding: 13px 22px;
        min-height: 44px;
      }
      button:hover { background: #a81a33; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Sin conexión</div>
      <h1>No tienes conexión a internet en este momento.</h1>
      <p>Vuelve a intentarlo cuando tengas señal. Mientras tanto, puedes seguir usando las secciones que ya visitaste.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
